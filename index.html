<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pentaksiran BIG 2027</title>
<style>
:root{
  --bg:#f4f2ec;--surface:#fff;--surface-2:#efede6;--text:#1d2420;--muted:#5d6a63;--line:#e0ddd3;
  --primary:#1f5f4a;--primary-ink:#fff;--primary-soft:#e2eee8;--accent:#b9741f;
  --ok:#2f7d4f;--ok-soft:#e1f1e7;--bad:#b23b2e;--bad-soft:#f8e3e0;--warn:#9a5c0c;--warn-soft:#f7ecd9;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.06);
  --r:14px;--nav-h:64px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513;--surface:#191f1c;--surface-2:#212924;--text:#e6ebe8;--muted:#9aa7a0;--line:#2b3530;
  --primary:#5fb391;--primary-ink:#0b1a13;--primary-soft:#1e3329;--accent:#e0a458;
  --ok:#6cc28f;--ok-soft:#1b3326;--bad:#ef7d6f;--bad-soft:#3a1f1b;--warn:#e3a64f;--warn-soft:#382a14;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111513;--surface:#191f1c;--surface-2:#212924;--text:#e6ebe8;--muted:#9aa7a0;--line:#2b3530;
  --primary:#5fb391;--primary-ink:#0b1a13;--primary-soft:#1e3329;--accent:#e0a458;
  --ok:#6cc28f;--ok-soft:#1b3326;--bad:#ef7d6f;--bad-soft:#3a1f1b;--warn:#e3a64f;--warn-soft:#382a14;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}

/* Header */
.top{position:sticky;top:0;z-index:30;background:var(--primary);color:var(--primary-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top .brand{flex:1;min-width:0}
.top .brand b{display:block;font-size:16px;letter-spacing:.2px}
.top .brand small{display:block;font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:inherit;display:grid;place-items:center;flex-shrink:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active{transform:scale(.95)}

/* Layout */
.view{display:none}.view.on{display:block}
main{padding:16px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto}
.screen{display:none}.screen.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
h2.title{font-size:22px;margin:4px 0 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3{font-size:16px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Bottom nav (mobile) / rail (desktop) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--primary)}
.nav button.on svg{background:var(--primary-soft);border-radius:999px;padding:2px 14px;width:52px;box-sizing:content-box;height:20px}
@media (min-width:960px){
  .nav{top:0;bottom:0;right:auto;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:80px}
  .nav button{flex:0;height:48px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 20px;font-size:14px}
  .nav button.on{background:var(--primary-soft)}
  .nav button.on svg{background:none;padding:0;width:22px}
  .has-nav main{margin-left:220px;padding-bottom:40px}
  .top{z-index:40}
}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .n{font-size:28px;font-weight:700;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}

/* Forms */
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=tel],select,textarea{width:100%;min-height:46px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}
.row2{display:grid;gap:0 12px}
@media (min-width:640px){.row2{grid-template-columns:1fr 1fr}}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface)}
.check input{width:22px;height:22px;flex-shrink:0;accent-color:var(--primary);margin-top:1px}

.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.block{width:100%}
.btn:disabled{opacity:.6;cursor:wait}
.btn:active:not(:disabled){transform:scale(.98)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--primary);font-weight:600;padding:6px 0}

/* Toolbar & chips */
.toolbar{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-bottom:12px}
.toolbar .full{grid-column:1/-1}
@media (min-width:760px){.toolbar{grid-template-columns:2fr 1fr 1fr}.toolbar .full{grid-column:auto}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

/* Student list */
.list{display:grid;gap:8px}
@media (min-width:760px){.list{grid-template-columns:1fr 1fr}}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.item:active{background:var(--surface-2)}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;flex-shrink:0;overflow:hidden;font-size:15px}
.avatar{position:relative}.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.item .meta{flex:1;min-width:0}
.item .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:4px;margin-top:5px}
.dot{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.dot.y{background:var(--ok-soft);color:var(--ok)}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.badge.Lulus{background:var(--ok-soft);color:var(--ok)}
.badge.Gagal{background:var(--bad-soft);color:var(--bad)}
.pct{font-size:12px;color:var(--muted);text-align:right}

/* Score picker */
.aspek{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;background:var(--surface)}
.aspek h4{font-size:15px;margin-bottom:2px}
.aspek p{font-size:13px;color:var(--muted);margin-bottom:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.seg button small{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:2px}
.seg button.on[data-s="3"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg button.on[data-s="2"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.seg button.on[data-s="1"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.seg button.on small{color:inherit}
.rub{font-size:12.5px;color:var(--muted);margin-top:8px;padding:8px 10px;background:var(--surface-2);border-radius:10px}
.stickybar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);margin:12px -16px -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
.stickybar .sum{flex:1;font-size:13px;color:var(--muted)}
.stickybar .sum b{display:block;font-size:18px;color:var(--text)}

/* Sheet (dialog) */
dialog.sheet{border:0;padding:0;background:var(--bg);color:var(--text);width:100%;max-width:760px;height:100dvh;max-height:100dvh;margin:0 auto}
@media (min-width:760px){dialog.sheet{height:92dvh;margin:auto;border-radius:18px}}
dialog.sheet::backdrop{background:rgba(10,15,12,.5)}
.sheet-wrap{display:flex;flex-direction:column;height:100%}
.sheet-head{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 12px 0}
.sheet-head .hrow{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.sheet-head .icon-btn{background:var(--surface-2)}
.sheet-head .t{flex:1;min-width:0}
.sheet-head .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;gap:2px}
.tabs button{flex-shrink:0;border:0;background:none;padding:10px 12px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.sheet-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}

/* Info list */
dl.info{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:8px 12px;font-size:14px}
dl.info dt{color:var(--muted)}
dl.info dd{word-break:break-word}

/* Table (desktop) -> cards (mobile) */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl tr.click{cursor:pointer}
@media (max-width:759px){
  .tbl thead{display:none}
  .tbl tr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:8px}
  .tbl td{border:0;padding:0}
  .tbl td.c-nm{font-weight:650}
  .tbl td.c-st{grid-row:1/3;grid-column:2;align-self:center}
  .tbl td.c-act{grid-column:2;grid-row:3/6;align-self:end;text-align:right}
  .tbl td.c-sub{font-size:12px;color:var(--muted);grid-column:1}
  .tbl td.hide-m{display:none}
}

/* States */
.skel{height:72px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sh 1.2s linear infinite;margin-bottom:8px}
@keyframes sh{to{background-position:-200% 0}}
.state{text-align:center;padding:36px 16px;color:var(--muted)}
.state.err{background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:18px}
.state.err .btn{margin-top:10px}
.note{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;margin-bottom:12px}
.note.ok{background:var(--ok-soft);color:var(--ok)}

/* Login */
.login{min-height:calc(100dvh - 64px);display:grid;place-items:center;padding:20px 16px}
.login .card{width:100%;max-width:420px;padding:22px}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:18px}
.seg2 button{border:0;background:none;min-height:40px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg2 button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.err-msg{color:var(--bad);font-size:14px;margin-top:10px}

/* FAB & toast */
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:20;height:56px;padding:0 20px;border-radius:18px;border:0;background:var(--accent);color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px}
@media (min-width:960px){.fab{bottom:24px;right:24px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top));z-index:100;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.bad{background:var(--bad);color:#fff}
.photo{width:120px;height:120px;border-radius:16px;object-fit:cover;background:var(--surface-2);display:block}
/* B1 / C1 */
.b1{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px;background:var(--surface)}
.b1h{background:var(--primary);color:var(--primary-ink);font-size:12px;font-weight:700;padding:9px 12px;letter-spacing:.3px}
.b1q{padding:10px 12px;border-top:1px solid var(--line)}
.b1q .t{font-size:14px;margin-bottom:8px}
.yt{display:flex;gap:6px}
.yt label{flex:1;max-width:120px;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:1.5px solid var(--line);border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.yt input{position:absolute;opacity:0;pointer-events:none}
.yt label.ya:has(input:checked){background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.yt label.td:has(input:checked){background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.b1q input.cat{margin-top:8px}
.legal{font-size:14px;line-height:1.75;text-align:justify}
.legal p{margin-bottom:10px}
.legal u{font-weight:700;text-decoration:none;border-bottom:1px solid currentColor}
.dot.warn{background:var(--bad-soft);color:var(--bad)}
.erams{width:100%;height:calc(100dvh - 210px - env(safe-area-inset-bottom));border:1px solid var(--line);border-radius:var(--r);background:#fff}
@media (min-width:960px){.erams{height:calc(100dvh - 150px)}}
.upload{display:flex;gap:14px;align-items:center}.upload>div{min-width:0;flex:1}.upload input[type=file]{max-width:100%;font-size:13px}
html,body{overflow-x:hidden}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>Pentaksiran BIG 2026</b><small id="who">Program Bina Insan Guru · IPG</small></div>
  <button class="icon-btn" id="btn-theme" title="Tukar tema" aria-label="Tukar tema" onclick="cycleTheme()"></button>
  <button class="icon-btn" id="btn-logout" title="Keluar" aria-label="Keluar" onclick="logout()" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>
  </button>
</header>

<!-- ============ LOGIN ============ -->
<section class="view on" id="v-login">
  <div class="login"><div class="card">
    <h2 class="title" style="margin-top:0">Log Masuk</h2>
    <div class="seg2">
      <button id="lt-staf" class="on" onclick="loginTab('staf')">Pensyarah</button>
      <button id="lt-pel" onclick="loginTab('pel')">Pelajar</button>
    </div>
    <form id="f-staf" onsubmit="return doLoginStaf(event)">
      <label class="f"><span>Email</span><input type="email" id="l-email" autocomplete="username" placeholder="nama@ipgm.edu.my" required></label>
      <label class="f"><span>Kata laluan</span><input type="password" id="l-pw" autocomplete="current-password" required></label>
      <div id="daftar" hidden>
        <div class="note">Pendaftaran kali pertama. Kod Pendaftaran boleh didapati daripada penyelaras.</div>
        <label class="f"><span>Nama penuh</span><input type="text" id="l-nama"></label>
        <label class="f"><span>Peranan</span><select id="l-peranan"><option value="">Pilih</option><option value="penyelaras">Penyelaras</option><option value="pensyarah">Pensyarah / Jurulatih / Kaunselor</option></select></label>
        <label class="f"><span>IPG Kampus</span><select id="l-ipgk"></select></label>
        <label class="f"><span>Kod Pendaftaran</span><input type="text" id="l-kod" autocomplete="off"></label>
      </div>
      <button class="btn pri block" id="b-staf" type="submit">Log Masuk</button>
      <div class="small muted" style="margin-top:10px;text-align:center"><button type="button" class="link" onclick="showDaftar(true)">Pengguna baharu? Daftar di sini</button></div>
    </form>
    <form id="f-pel" onsubmit="return doLoginPel(event)" hidden>
      <label class="f"><span>No. Kad Pengenalan</span><input type="text" id="l-kp" inputmode="numeric" autocomplete="off" placeholder="040512101234" required></label>
      <button class="btn pri block" id="b-pel" type="submit">Log Masuk</button>
    </form>
    <div class="err-msg" id="l-err" hidden></div>
  </div></div>
</section>

<!-- ============ PENSYARAH ============ -->
<section class="view" id="v-staf">
  <nav class="nav" id="nav-staf">
    <button data-s="utama" class="on" onclick="go('utama')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Utama</button>
    <button data-s="pelajar" onclick="go('pelajar')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Pelajar</button>
    <button data-s="laporan" onclick="go('laporan')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Laporan</button>
    <button data-s="rubrik" onclick="go('rubrik')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h12l4 4v12H4zM8 10h8M8 14h8M8 18h5"/></svg>Rubrik</button>
    <button data-s="erams" onclick="go('erams')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>e-RAMS</button>
  </nav>
  <main>
    <div class="screen on" id="s-utama"></div>
    <div class="screen" id="s-pelajar">
      <h2 class="title">Pelajar</h2>
      <div class="toolbar">
        <input type="search" class="full" id="q" placeholder="Cari nama, No. KP, kumpulan…" oninput="renderPelajar()">
        <select id="f-siri" onchange="renderAll()"><option value="">Semua siri</option></select>
        <select id="f-tind" onchange="renderPelajar()">
          <option value="">Semua</option><option value="noP">Belum nilai Perkhemahan</option><option value="noJ">Belum nilai Jalinan</option>
          <option value="noB">Belum isi B1/C1</option><option value="b1Ya">Ada isu kesihatan (B1)</option><option value="Lulus">Lulus</option><option value="Gagal">Gagal</option>
        </select>
      </div>
      <div id="list-pelajar"></div>

<script>
// ===================== KONFIGURASI =====================
var GAS_URL = "https://script.google.com/macros/s/AKfycbwA93jJVBFkIYyXDlOLwirgF3GpfeUdy8ts-MGsxPJcTjWQOx-6RrTgCd7N35CT2oprIQ/exec";
// Logo pada semua cetakan. Disyorkan: muat naik fail logo ke repo GitHub, kemudian tukar kepada "logo-ipg.jpg"
// Mesti sama dengan API_VERSI dalam Code.gs
var API_VERSI = 3;
// Aplikasi e-RAMS penuh (ruangan admin/pensyarah sahaja)
var ERAMS_URL = "https://unitkokurikulumipgkda.github.io/e-RAMS/";
// Maklumat Borang C1 (Akuan Lepas Tanggung) yang dipaparkan kepada pelajar
var C1_PROGRAM = "PROGRAM BINA INSAN GURU (BIG) 2026";

var IPGK = ["IPG Kampus Bahasa Antarabangsa","IPG Kampus Bahasa Melayu","IPG Kampus Dato Razali Ismail","IPG Kampus Gaya","IPG Kampus Ilmu Khas","IPG Kampus Ipoh","IPG Kampus Kent","IPG Kampus Kuantan","IPG Kampus Lembah Pantai","IPG Kampus Pendidikan Islam","IPG Kampus Pendidikan Teknik","IPG Kampus Perempuan Melayu","IPG Kampus Perlis","IPG Kampus Raja Melewar","IPG Kampus Sandakan","IPG Kampus Sarawak","IPG Kampus Sultan Abdul Halim","IPG Kampus Sultan Idris","IPG Kampus Sultan Mizan","IPG Kampus Tawau","IPG Kampus Temenggong Ibrahim","IPG Kampus Tengku Ampuan Afzan","IPG Kampus Tuanku Bainun","IPG Kampus Tun Hussein Onn","IPG Kampus Mersing"];
var P_ASPEK = [
  {id:"P1",kol:"P1_NilaiDisiplinSahsiah",nama:"Nilai, Disiplin dan Sahsiah Keguruan",desc:"Pematuhan disiplin, adab, akhlak, dan jati diri pendidik"},
  {id:"P2",kol:"P2_KepimpinanKomunikasi",nama:"Kepimpinan, Komunikasi dan Kerja Berpasukan",desc:"Keupayaan memimpin, berkomunikasi berkesan dan bekerjasama"},

  {id:"P6",kol:"P6_Refleksi",nama:"Refleksi dan Penambahbaikan Diri",desc:"Membuat refleksi, mengenal pasti kekuatan dan penambahbaikan diri"}
];
var J_ASPEK = [
  {id:"J1",kol:"J1_NilaiEtika",nama:"Nilai, Etika dan Profesionalisme Keguruan",desc:"Penerapan nilai dan etika keguruan"},
  {id:"J2",kol:"J2_KepimpinanKomunikasi",nama:"Kepimpinan, Komunikasi dan Kerja Berpasukan",desc:"Kepimpinan dan kerjasama dengan komuniti"},
  {id:"J3",kol:"J3_AplikasiIlmu",nama:"Aplikasi Ilmu, Kemahiran dan Kepakaran",desc:"Mengaplikasikan ilmu dan kemahiran sebagai bakal guru"},
  {id:"J4",kol:"J4_SumbanganKomuniti",nama:"Sumbangan dan Keprihatinan terhadap Komuniti",desc:"Keprihatinan dan sumbangan kepada komuniti"},
  {id:"J5",kol:"J5_Refleksi",nama:"Refleksi dan Penambahbaikan Diri",desc:"Refleksi atas pengalaman Jalinan Bakti"}
];
var TAHAP = {3:"Cemerlang",2:"Memuaskan",1:"Perlu Bimbingan"};
var SOALAN = ["Apakah yang saya pelajari daripada pengalaman ini?","Apakah kekuatan diri dan perkara yang perlu saya tambah baik?","Bagaimanakah pengalaman ini dapat saya gunakan sebagai guru?"];

var S = { token:null, role:null, user:null, students:null, rubrik:null, detail:null, tab:"perkhemahan", scores:{}, repStatus:"" };

// ===================== UTILITI =====================
function $(id){ return document.getElementById(id); }
function h(v){ return v == null ? "" : String(v).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function store(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function load(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function initials(n){ return String(n||"?").trim().split(/\s+/).slice(0,2).map(function(w){return w[0];}).join("").toUpperCase(); }
function imgUrl(u){
  if (!u) return "";
  var m = String(u).match(/\/d\/([\w-]{20,})/) || String(u).match(/[?&]id=([\w-]{20,})/);
  return m ? "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w400" : u;
}
function avatar(s){
  var u = imgUrl(s.URL_Gambar);
  return "<div class='avatar'>" + (u ? "<img src='" + h(u) + "' alt='' loading='lazy' onerror=\"this.remove()\">" : "") + h(initials(s.Nama_Pelajar)) + "</div>";
}
function fmtDate(v){ if (!v) return "-"; var d = new Date(String(v).split(" | ")[0]); return isNaN(d) ? String(v) : d.toLocaleString("ms-MY",{dateStyle:"medium",timeStyle:"short"}); }

var toastT;
function toast(msg, bad){
  var t = $("toast"); t.textContent = msg; t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toastT); toastT = setTimeout(function(){ t.className = "toast" + (bad ? " bad" : ""); }, bad ? 4500 : 2500);
}

// Panggilan API: satu permintaan, had masa jelas, tiada ulangan automatik
function api(action, data, timeoutMs){
  data = data || {};
  if (!/^https:\/\/script\.google\.com\//.test(GAS_URL)) return Promise.reject(new Error("GAS_URL belum ditetapkan dalam index.html."));
  var body = {}; for (var k in data) body[k] = data[k];
  body.action = action; body.token = S.token; body.v = API_VERSI;
  var ctl = new AbortController(), timer = setTimeout(function(){ ctl.abort(); }, timeoutMs || 30000);
  return fetch(GAS_URL, { method:"POST", body:JSON.stringify(body), signal:ctl.signal, redirect:"follow" })
    .catch(function(e){ throw new Error(e.name === "AbortError" ? "Pelayan lambat bertindak balas. Sila cuba lagi." : "Tiada sambungan internet atau pelayan tidak dapat dicapai."); })
    .then(function(r){ return r.json().catch(function(){ throw new Error("Respons pelayan tidak sah. Semak deployment Apps Script (Who has access: Anyone)."); }); })
    .then(function(j){
      if (!j.success) {
        if (j.code === "AUTH" && action !== "logout") { endSession(); toast(j.error, true); }
        if (j.code === "VERSI") showUpdateBanner(j.error);
        var err = new Error(j.error || "Ralat tidak diketahui."); err.code = j.code; throw err;
      }
      return j.data;
    })
    .finally(function(){ clearTimeout(timer); });
}

function showUpdateBanner(msg){
  if ($("upd")) return;
  var d = document.createElement("div"); d.id = "upd";
  d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:200;background:var(--accent);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;gap:12px;align-items:center;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2)";
  d.innerHTML = "<div style='flex:1'>" + h(msg) + "</div><button class='btn' style='color:#1d2420;background:#fff;flex-shrink:0' onclick='location.reload()'>Muat semula</button>";
  document.body.appendChild(d);
}
function busy(btn, on, label){
  if (!btn) return;
  if (on) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = label || "Menyimpan…"; }
  else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
}

function skel(n){ var s = ""; for (var i = 0; i < (n||4); i++) s += "<div class='skel'></div>"; return s; }
function errBox(msg, retryFn){ return "<div class='state err'><div>" + h(msg) + "</div><button class='btn' onclick='" + retryFn + "'>Cuba lagi</button></div>"; }

// ===================== TEMA =====================
var THEMES = ["auto","light","dark"];
var ICONS = {
  auto:"<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><circle cx='12' cy='12' r='9'/><path d='M12 3v18' /><path d='M12 3a9 9 0 0 1 0 18z' fill='currentColor'/></svg>",
  light:"<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'><circle cx='12' cy='12' r='4'/><path d='M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4'/></svg>",
  dark:"<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'><path d='M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z'/></svg>"
};
function applyTheme(t){
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  $("btn-theme").innerHTML = ICONS[t];
  $("btn-theme").title = "Tema: " + ({auto:"ikut peranti",light:"cerah",dark:"gelap"})[t];
  var dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector("meta[name=theme-color]").content = dark ? "#191f1c" : "#1f5f4a";
}
function cycleTheme(){
  var cur = load("big-theme") || "auto", next = THEMES[(THEMES.indexOf(cur) + 1) % 3];
  store("big-theme", next); applyTheme(next); toast("Tema: " + ({auto:"ikut peranti",light:"cerah",dark:"gelap"})[next]);
}

// ===================== LOGIN / SESI =====================
function loginTab(t){
  $("lt-staf").classList.toggle("on", t === "staf"); $("lt-pel").classList.toggle("on", t === "pel");
  $("f-staf").hidden = t !== "staf"; $("f-pel").hidden = t !== "pel"; $("l-err").hidden = true;
}
function showDaftar(on){ $("daftar").hidden = !on; $("b-staf").textContent = on ? "Daftar & Log Masuk" : "Log Masuk"; }
function loginErr(m){ $("l-err").textContent = m; $("l-err").hidden = false; }

function doLoginStaf(e){
  e.preventDefault(); $("l-err").hidden = true;
  var b = $("b-staf"); busy(b, true, "Sila tunggu…");
  api("loginPensyarah", { email:$("l-email").value.trim(), password:$("l-pw").value, nama:$("l-nama").value.trim(), peranan:$("l-peranan").value, ipgk:$("l-ipgk").value, kodDaftar:$("l-kod").value.trim() })
    .then(function(d){ startSession("staf", d.token, d.user); })
    .catch(function(err){ if (err.code === "DAFTAR") showDaftar(true); loginErr(err.message); })
    .finally(function(){ busy(b, false); });
  return false;
}
function doLoginPel(e){
  e.preventDefault(); $("l-err").hidden = true;
  var b = $("b-pel"); busy(b, true, "Sila tunggu…");
  api("loginPelajar", { noKP:$("l-kp").value })
    .then(function(d){ startSession("pel", d.token, d.student); })
    .catch(function(err){ loginErr(err.message); })
    .finally(function(){ busy(b, false); });
  return false;
}

function startSession(role, token, user){
  S.token = token; S.role = role; S.user = user;
  store("big-sesi", { token:token, role:role, user:user });
  $("l-pw").value = ""; $("l-kod").value = ""; showDaftar(false);
  $("btn-logout").hidden = false;
  $("v-login").classList.remove("on");
  document.body.classList.add("has-nav");
  if (role === "staf") {
    $("who").textContent = user.nama + " · " + (user.peranan === "penyelaras" ? "Penyelaras" : "Pensyarah");
    $("v-staf").classList.add("on"); go("utama"); fetchStudents();
  } else {
    $("who").textContent = (user.Nama_Pelajar || "") + " · Pelajar";
    $("v-pel").classList.add("on"); fetchMine();
  }
}
function endSession(){
  S.token = null; S.role = null; S.user = null; S.students = null; S.detail = null;
  store("big-sesi", null);
  if ($("sheet").open) $("sheet").close();
  $("v-staf").classList.remove("on"); $("v-pel").classList.remove("on"); $("v-login").classList.add("on");
  document.body.classList.remove("has-nav");
  $("btn-logout").hidden = true; $("who").textContent = "Program Bina Insan Guru · IPG";
}
function logout(){
  if (!confirm("Log keluar?")) return;
  api("logout").catch(function(){}); endSession();
}

// ===================== PENSYARAH: NAVIGASI & DATA =====================
function go(name){
  document.querySelectorAll("#v-staf .screen").forEach(function(s){ s.classList.toggle("on", s.id === "s-" + name); });
  document.querySelectorAll("#nav-staf button").forEach(function(b){ b.classList.toggle("on", b.dataset.s === name); });
  if (name === "rubrik") renderRubrik($("rubrik-body"));
  if (name === "erams" && !$("erams-frame").src) { $("erams-frame").src = ERAMS_URL; $("erams-open").href = ERAMS_URL; }
  window.scrollTo(0, 0);
}

var loadingStudents = false;
function fetchStudents(){
  if (loadingStudents) return; // elak permintaan bertindih
  loadingStudents = true;
  if (!S.students) { $("s-utama").innerHTML = "<h2 class='title'>Utama</h2>" + skel(3); $("list-pelajar").innerHTML = skel(6); $("s-laporan").innerHTML = "<h2 class='title'>Laporan</h2>" + skel(4); }
  api("getAllStudents").then(function(list){
    S.students = list; fillSiri(); renderAll();
  }).catch(function(err){
    if (S.students) { toast(err.message, true); return; }
    var box = errBox(err.message, "fetchStudents()");
    $("s-utama").innerHTML = "<h2 class='title'>Utama</h2>" + box; $("list-pelajar").innerHTML = box; $("s-laporan").innerHTML = "<h2 class='title'>Laporan</h2>" + box;
  }).finally(function(){ loadingStudents = false; });
}

function fillSiri(){
  var sel = $("f-siri"), cur = sel.value, set = {};
  S.students.forEach(function(s){ if (s.Siri) set[s.Siri] = 1; });
  sel.innerHTML = "<option value=''>Semua siri</option>" + Object.keys(set).sort().map(function(x){ return "<option>" + h(x) + "</option>"; }).join("");
  sel.value = cur;
}

function siriSelect(){
  var f = $("f-siri").value;
  return "<select onchange=\"$('f-siri').value=this.value;renderAll()\">" + Array.prototype.map.call($("f-siri").options, function(o){ return "<option value='" + h(o.value) + "'" + (o.value === f ? " selected" : "") + ">" + h(o.textContent) + "</option>"; }).join("") + "</select>";
}
function bySiri(){ var f = $("f-siri").value; return (S.students || []).filter(function(s){ return !f || String(s.Siri) === f; }); }
function renderAll(){ if (!S.students) return; renderUtama(); renderPelajar(); renderLaporan(); }

function renderUtama(){
  var L = bySiri(), n = L.length, f = $("f-siri").value;
  var c = function(fn){ return L.filter(fn).length; };
  var dP = c(function(s){return s.hasP;}), dJ = c(function(s){return s.hasJ;}), dB = c(function(s){return s.hasB;});
  var lulus = c(function(s){return s.status==="Lulus";}), gagal = c(function(s){return s.status==="Gagal";});
  var pc = function(x){ return n ? Math.round(x / n * 100) : 0; };
  var html = "<h2 class='title'>Selamat datang, " + h(S.user.nama.split(" ")[0]) + "</h2>";
  html += "<div class='toolbar'>" + siriSelect() + "<button class='btn' onclick='fetchStudents()'>Muat semula</button></div>";
  html += "<div class='grid stats'>";
  html += stat(n, "Jumlah pelajar");
  html += stat(dP + "<span class='small muted'>/" + n + "</span>", "Dinilai Perkhemahan", pc(dP));
  html += stat(dJ + "<span class='small muted'>/" + n + "</span>", "Dinilai Jalinan", pc(dJ));
  html += stat(dB + "<span class='small muted'>/" + n + "</span>", "Borang B1 & C1 diisi", pc(dB));
  html += stat("<span style='color:var(--ok)'>" + lulus + "</span>", "Lulus");
  html += stat("<span style='color:var(--bad)'>" + gagal + "</span>", "Gagal");
  html += stat(n - lulus - gagal, "Belum dinilai");
  html += stat(lulus + gagal ? Math.round(L.reduce(function(a,s){ return a + (s.overall || 0); }, 0) / (lulus + gagal)) + "%" : "-", "Purata markah (dinilai)");
  html += "</div>";
  var todo = [];
  if (n - dP) todo.push(["noP", (n - dP) + " pelajar belum dinilai Perkhemahan"]);
  if (n - dJ) todo.push(["noJ", (n - dJ) + " pelajar belum dinilai Jalinan"]);
  if (n - dB) todo.push(["noB", (n - dB) + " pelajar belum isi Borang B1 & C1"]);
  var nYa = c(function(s){ return s.b1Ya > 0; });
  if (nYa) todo.push(["b1Ya", "⚠ " + nYa + " pelajar menjawab YA dalam Akuan Kesihatan (B1)"]);
  html += "<div class='card' style='margin-top:12px'><h3>Perlu tindakan</h3>";
  html += todo.length ? todo.map(function(t){ return "<button class='item' style='margin-bottom:6px' onclick=\"$('f-tind').value='" + t[0] + "';go('pelajar');renderPelajar()\"><div class='meta'>" + h(t[1]) + "</div><span class='muted'>›</span></button>"; }).join("") : "<div class='muted'>Semua pelajar telah dinilai. 🎉</div>";
  html += "</div>";
  html += "<div class='card'><h3>Maklumat penilaian</h3><dl class='info'><dt>Perkhemahan</dt><dd>70% (6 aspek, maks 18)</dd><dt>Jalinan Bakti</dt><dd>30% (5 aspek, maks 15)</dd><dt>Skala</dt><dd>3 Cemerlang · 2 Memuaskan · 1 Perlu Bimbingan</dd><dt>Lulus</dt><dd>60% ke atas</dd></dl></div>";
  $("s-utama").innerHTML = html;
}
function stat(n, l, pct){ return "<div class='stat'><div class='n'>" + n + "</div><div class='l'>" + l + "</div>" + (pct != null ? "<div class='bar'><i style='width:" + pct + "%'></i></div>" : "") + "</div>"; }

function renderPelajar(){
  if (!S.students) return;
  var q = $("q").value.trim().toLowerCase(), t = $("f-tind").value;
  var L = bySiri().filter(function(s){
    if (q && (s.Nama_Pelajar + " " + s.No_KP + " " + s.Kumpulan + " " + s.Kelas).toLowerCase().indexOf(q) === -1) return false;
    if (t === "noP") return !s.hasP; if (t === "noJ") return !s.hasJ; if (t === "noB") return !s.hasB; if (t === "b1Ya") return s.b1Ya > 0;
    if (t) return s.status === t;
    return true;
  });
  var el = $("list-pelajar");
  if (!S.students.length) { el.innerHTML = "<div class='state'>Belum ada pelajar.<br><br><button class='btn pri' onclick='openForm()'>Tambah pelajar pertama</button></div>"; return; }
  if (!L.length) { el.innerHTML = "<div class='state'>Tiada pelajar sepadan dengan carian.</div>"; return; }
  el.innerHTML = "<div class='small muted' style='margin-bottom:8px'>" + L.length + " pelajar</div><div class='list'>" + L.map(function(s){
    var d = function(on, l){ return "<span class='dot" + (on ? " y" : "") + "'>" + l + "</span>"; };
    return "<button class='item' onclick=\"openDetail('" + h(s.No_KP) + "')\">" + avatar(s) +
      "<div class='meta'><div class='nm'>" + h(s.Nama_Pelajar) + "</div><div class='sub'>" + h(s.No_KP) + (s.Kumpulan ? " · Kump " + h(s.Kumpulan) : "") + (s.Siri ? " · Siri " + h(s.Siri) : "") + "</div>" +

function pick(btn, kol, id, s){

function updateSum(){
  var aspek = S.tab === "perkhemahan" ? P_ASPEK : J_ASPEK, tot = 0, n = 0;

  var max = aspek.length * 3, el = $("sum");
  if (el) el.innerHTML = "<b>" + tot + " / " + max + " · " + Math.round(tot / max * 100) + "%</b>" + n + " daripada " + aspek.length + " aspek diskor";
}
function saveScores(kind, btn){
  var aspek = kind === "P" ? P_ASPEK : J_ASPEK;

  busy(btn, true);
  api(kind === "P" ? "savePerkhemahanAssessment" : "saveJalinanAssessment", { pelajarId:S.detail.pelajar.No_KP, scores:S.scores, catatan:$("catatan").value })
    .then(function(d){ S.detail = d; toast("Pentaksiran disimpan ✓"); renderDetail(); patchStudent(d); })
    .catch(function(e){ toast(e.message, true); busy(btn, false); });
}

function patchStudent(d){
  if (!S.students) return;
  var s = S.students.filter(function(x){ return x.No_KP === d.pelajar.No_KP; })[0]; if (!s) return;
  var o = d.overall;
  s.p = o && o.perkhemahan ? o.perkhemahan.percent : null; s.j = o && o.jalinan ? o.jalinan.percent : null;
  s.overall = o ? o.percent : null; s.status = d.status;
  s.hasP = !!(o && o.perkhemahan); s.hasJ = !!(o && o.jalinan); s.hasR = !!d.refleksi; s.hasB = !!d.borang;
  s.refPdf = d.refleksi ? (d.refleksi.URL_PDF || "") : "";

function refleksiView(r){
  if (!r || (!r.Refleksi_1 && !r.Refleksi_2 && !r.Refleksi_3 && !r.URL_PDF)) return "<div class='muted'>Belum diisi.</div>";
  var keys = ["Refleksi_1","Refleksi_2","Refleksi_3"], x = "";
  SOALAN.forEach(function(q, i){ if (r[keys[i]]) x += "<div style='margin-bottom:10px'><div class='small muted'>" + (i+1) + ". " + h(q) + "</div><div style='white-space:pre-wrap'>" + h(r[keys[i]]) + "</div></div>"; });

function refVals(){ return { r1:$("ref-0").value, r2:$("ref-1").value, r3:$("ref-2").value }; }
function readPdf(file){
  return new Promise(function(res, rej){
    if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") return rej(new Error("Sila pilih fail PDF."));
    if (file.size > PDF_MAKS_MB * 1024 * 1024) return rej(new Error("Fail PDF melebihi " + PDF_MAKS_MB + "MB."));
    var fr = new FileReader();
    fr.onload = function(){ res(String(fr.result).split(",")[1]); };
    fr.onerror = function(){ rej(new Error("Fail tidak dapat dibaca.")); };
    fr.readAsDataURL(file);
  });
}
// Simpan teks, kemudian PDF (jika dipilih). Satu aliran, tiada ulangan automatik.
function saveRefleksiAll(btn, pelajarId){
  var v = refVals(), file = $("ref-pdf").files[0];

  if (pelajarId) v.pelajarId = pelajarId;
  busy(btn, true);
  return api("saveRefleksi", v).then(function(){
    if (!file) return;
    btn.innerHTML = "Memuat naik PDF…";
    return readPdf(file).then(function(b64){ var d = { base64Data:b64 }; if (pelajarId) d.pelajarId = pelajarId; return api("saveRefleksiPdf", d, 120000); });
  }).then(function(){ toast(file ? "Refleksi & PDF disimpan ✓" : "Refleksi disimpan ✓"); return api("getStudentDetail", pelajarId ? { pelajarId:pelajarId } : {}); })
    .catch(function(e){ toast(e.message, true); busy(btn, false); throw null; });
}

// Kecilkan gambar ke maks 800px JPEG supaya muat naik pantas di data mudah alih
function compressImg(file){
  return new Promise(function(res, rej){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var k = Math.min(1, 800 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.82).split(",")[1]);
    };
    img.onerror = function(){ rej(new Error("Gambar tidak dapat dibaca. Cuba gambar lain (JPG/PNG).")); };
    img.src = url;
  });
}

    b1[q.id] = { status: r ? r.value : "TIDAK", catatan: $("cat_" + q.id).value.trim() };
  });
  api("saveBorangPelepasan", { formData:{ b1:b1, perakuanKesihatan:$("bp-pk").checked, perakuanLepasTanggung:$("bp-pr").checked, program:$("c1-prog").value, tarikh:$("c1-tkh").value, institusi:$("c1-inst").value } })
    .then(function(){
      if (!file) return null;
      btn.innerHTML = "Memuat naik gambar…";
      return compressImg(file).then(function(b64){ return api("saveImageBlob", { base64Data:b64 }, 60000); })
        .catch(function(err){ toast("Borang disimpan, tetapi gambar gagal: " + err.message, true); return "x"; });
    })
    .then(function(r){ if (r !== "x") toast("Borang berjaya dihantar ✓"); return api("getStudentDetail", {}); })
    .then(function(d){ S.detail = d; renderMine(); })
    .catch(function(err){ toast(err.message, true); busy(btn, false); });
  return false;
}
function saveRefleksiPel(btn){
  saveRefleksiAll(btn, null).then(function(d){ S.detail = d; renderMine(); }).catch(function(){});
}

  $("l-ipgk").innerHTML = "<option value=''>Pilih</option>" + IPGK.map(function(x){ return "<option>" + h(x) + "</option>"; }).join("");
  var sesi = load("big-sesi");
  if (sesi && sesi.token) startSession(sesi.role, sesi.token, sesi.user);
})();
</script>
